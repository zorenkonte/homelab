# runner-bot — Telegram bot for GitHub Actions self-hosted runner registration tokens.
#
# Secrets NEVER go here. They are read from the two files below via Compose `secrets:`
# and appear inside the container at /run/secrets/<name>. Nothing secret is in `environment:`,
# so `docker inspect` and Portainer show no credentials.
#
# Fill in the three REPLACE_ME placeholders, then: docker compose up -d --build

name: runner-bot

services:
  runner-bot:
    build: .
    image: runner-bot:latest
    container_name: runner-bot
    restart: unless-stopped          # a manually stopped container stays stopped across reboots
    user: "10001:10001"              # must match the Dockerfile user and the secret files' owner

    # ---- non-secret configuration -------------------------------------------------
    environment:
      GITHUB_OWNER: "zorenkonte"          # <-- GitHub user or org that owns the repo
      GITHUB_REPO: "monitoring"            # <-- repository name (no owner, no .git)
      ALLOWED_USER_IDS: "5680807414"        # <-- Telegram numeric user IDs, comma-separated, e.g. "123456789,987654321"
      TOKEN_MESSAGE_TTL_SECONDS: "300"
      TZ: "Asia/Manila"
      # Optional loading sticker shown while GitHub is called. Either "<SetName>:<emoji>" or a
      # sticker file_id. Send any sticker to the bot and it replies with both. Empty = text only.
      LOADING_STICKER: "UtyaDuck:🧮"

    # ---- secrets (file-backed, bind-mounted read-only at /run/secrets/...) ---------
    secrets:
      - github_pat
      - telegram_bot_token

    # ---- hardening ----------------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    # No `ports:` (long polling only) and no `volumes:` on purpose.

    # ---- logging (bounded so it can never fill the SD card) -----------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---- healthcheck: the bot touches /tmp/heartbeat every 30 s from its job queue -
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<120 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  github_pat:
    file: /root/.secrets/runner-bot/github_pat
  telegram_bot_token:
    file: /root/.secrets/runner-bot/telegram_bot_token
